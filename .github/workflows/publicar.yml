name: Testar e publicar
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Testes n8n
        run: npm test
        working-directory: n8n
      - run: npm ci
        working-directory: web
      - name: Testes unitários web
        run: npm test
        working-directory: web
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Testes e2e
        run: npm run e2e
        working-directory: web

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Conferir URLs da API
        run: test -n "$VITE_API_LOGIN" && test -n "$VITE_API_BOARD" && test -n "$VITE_API_ACAO"
        env:
          VITE_API_LOGIN: ${{ vars.VITE_API_LOGIN }}
          VITE_API_BOARD: ${{ vars.VITE_API_BOARD }}
          VITE_API_ACAO: ${{ vars.VITE_API_ACAO }}
      - run: npm run build
        working-directory: web
        env:
          VITE_API_LOGIN: ${{ vars.VITE_API_LOGIN }}
          VITE_API_BOARD: ${{ vars.VITE_API_BOARD }}
          VITE_API_ACAO: ${{ vars.VITE_API_ACAO }}
      # Site de QA em /pcp-mrbl/qa/: código da branch de QA ligado à homologação (webhooks -h).
      - name: Baixar a branch de QA
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.QA_BRANCH || 'f4-gantt-whatsapp' }}
          path: qa
      - run: npm ci
        working-directory: qa/web
      - name: Build do site de QA
        run: npx tsc -b && npx vite build --base /pcp-mrbl/qa/
        working-directory: qa/web
        env:
          VITE_API_LOGIN: ${{ vars.VITE_API_LOGIN }}-h
          VITE_API_BOARD: ${{ vars.VITE_API_BOARD }}-h
          VITE_API_ACAO: ${{ vars.VITE_API_ACAO }}-h
      - run: cp -r qa/web/dist web/dist/qa
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
